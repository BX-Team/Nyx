name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again and attach to its release (e.g. v1.2.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Check that the tag and the manifest agree
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a v<semver> tag"
            exit 1
          fi
          if ! grep -qx "version = \"$version\"" Cargo.toml; then
            echo "::error::Cargo.toml at $TAG does not carry version $version; was it tagged off the release PR merge?"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Make sure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          # The bot opens the draft before it pushes the tag; this covers a tag pushed by hand.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --prerelease="$PRERELEASE" --title "Nyx $VERSION" --notes ""
          fi

  package:
    name: Package
    needs: [prepare]
    permissions:
      contents: write
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      release: ${{ needs.prepare.outputs.tag }}

  cachix:
    name: Push to Cachix (${{ matrix.system }})
    needs: [prepare]
    if: needs.prepare.outputs.prerelease != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: bx-team
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push the flake packages
        run: nix build --print-build-logs .#nyx

  publish:
    name: Publish the release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          have="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          printf 'attached:\n%s\n\n' "$have"
          missing=0
          for asset in \
            Nyx-x86_64-linux.tar.gz nyx-amd64.deb nyx-x86_64.rpm nyx-x86_64.pkg.tar.xz \
            Nyx-x86_64-windows.zip Nyx-Setup-x86_64.exe; do
            if ! printf '%s\n' "$have" | grep -qxF "$asset"; then
              echo "::error::missing release asset '$asset'"
              missing=1
            fi
          done
          exit "$missing"

      - name: Add the downloads to the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > notes.md
          # Rebuilding a published release must not append the table a second time.
          if ! grep -q '^## 📦 Downloads' notes.md; then
            export TAG
            if [ -s notes.md ]; then printf '\n' >> notes.md; fi
            # shellcheck disable=SC2016 # the list names the variables envsubst may replace
            envsubst '$TAG' < .github/release/notes.md >> notes.md
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if grep -qF '<!-- release:hold -->' notes.md; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md \
              --prerelease="$PRERELEASE"
            echo "::notice::$TAG is held as a draft by /release draft; publish it on GitHub once it is checked."
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md \
              --draft=false \
              --prerelease="$PRERELEASE" \
              --latest="$([ "$PRERELEASE" = true ] && echo false || echo true)"
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
