name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 2.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a pre-release
        default: false
        type: boolean
      draft:
        description: Publish the release as a draft
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  prepare:
    name: Resolve the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      rpm_version: ${{ steps.resolve.outputs.rpm_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version and find the previous tag
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "rpm_version=${VERSION//-/\~}"
            echo "tag=v$VERSION"
            echo "previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          } >> "$GITHUB_OUTPUT"

  format:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev mesa-vulkan-drivers

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: lint-${{ matrix.name }}

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tag:
    name: Bump the version and tag
    needs: [prepare, format, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set the version in Cargo.toml, Cargo.lock and flake.nix
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          sed -i '/^name = "nyx"$/,/^version = / s/^version = ".*/version = "'"$VERSION"'"/' Cargo.lock
          sed -i '/pname = "nyx";/,/version = / s/version = "[^"]*";/version = "'"$VERSION"'";/' flake.nix
          grep -q "^version = \"$VERSION\"$" Cargo.toml
          grep -q "version = \"$VERSION\";" flake.nix

      - name: Commit the bump and push the tag
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock flake.nix
          git commit -m "chore(release): bump version to $VERSION"
          git tag -a "$TAG" -m "$VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [prepare, tag]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev mesa-vulkan-drivers

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Install the packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Package for Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RPM_VERSION: ${{ needs.prepare.outputs.rpm_version }}
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/Nyx-x86_64-linux.tar.gz" nyx
          cargo deb -p nyx --no-build --output "dist/Nyx_${VERSION}_amd64.deb"
          cargo generate-rpm -s "version = \"$RPM_VERSION\""
          cp target/generate-rpm/*.rpm "dist/Nyx-${RPM_VERSION}.x86_64.rpm"

      - name: Package for Arch
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          cp target/release/nyx           installer/arch/nyx
          cp installer/linux/nyx.desktop  installer/arch/nyx.desktop
          cp assets/brand/logo.png        installer/arch/nyx.png
          docker run --rm -v "$PWD/installer/arch:/pkg" -e VER="$VERSION" \
            archlinux:latest bash -c '
              pacman -Sy --noconfirm base-devel >/dev/null
              useradd -m builder
              cp -r /pkg /home/builder/pkg && chown -R builder /home/builder/pkg
              cd /home/builder/pkg
              sed -i "s/^pkgver=.*/pkgver=${VER//-/_}/" PKGBUILD
              sudo -u builder env PKGEXT=.pkg.tar.xz makepkg -f --nodeps
              cp *.pkg.tar.xz /pkg/
            '
          cp installer/arch/*.pkg.tar.xz "dist/Nyx-${VERSION}-x86_64.pkg.tar.xz"

      - name: Package for Windows
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/release/nyx.exe" -DestinationPath "dist/Nyx-x86_64-windows.zip" -Force
          choco install nsis -y --no-progress
          $exe = (Resolve-Path "target/release/nyx.exe").Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DAPPVERSION=$env:VERSION" "/DSOURCEEXE=$exe" `
            installer/windows/nyx.nsi
          Copy-Item "installer/windows/Nyx_${env:VERSION}_x64-setup.exe" dist/

      - name: Upload the Linux portable archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Nyx-x86_64-linux.tar.gz
          path: dist/Nyx-x86_64-linux.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Nyx_${{ needs.prepare.outputs.version }}_amd64.deb
          path: dist/Nyx_${{ needs.prepare.outputs.version }}_amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload the RPM package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Nyx-${{ needs.prepare.outputs.rpm_version }}.x86_64.rpm
          path: dist/Nyx-${{ needs.prepare.outputs.rpm_version }}.x86_64.rpm
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Arch package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Nyx-${{ needs.prepare.outputs.version }}-x86_64.pkg.tar.xz
          path: dist/Nyx-${{ needs.prepare.outputs.version }}-x86_64.pkg.tar.xz
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Windows portable archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Nyx-x86_64-windows.zip
          path: dist/Nyx-x86_64-windows.zip
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Nyx_${{ needs.prepare.outputs.version }}_x64-setup.exe
          path: dist/Nyx_${{ needs.prepare.outputs.version }}_x64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

  cachix:
    name: Push to Cachix
    needs: [tag]
    if: ${{ ! inputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: bx-team
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push the flake package
        run: nix build --print-build-logs .#nyx

  publish:
    name: Publish the release
    needs: [prepare, tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release assets
        uses: actions/download-artifact@v8
        with:
          pattern: Nyx*
          merge-multiple: true
          path: dist

      - name: Verify the release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RPM_VERSION: ${{ needs.prepare.outputs.rpm_version }}
        shell: bash
        run: |
          for asset in \
            "Nyx-x86_64-linux.tar.gz" \
            "Nyx_${VERSION}_amd64.deb" \
            "Nyx-${RPM_VERSION}.x86_64.rpm" \
            "Nyx-${VERSION}-x86_64.pkg.tar.xz" \
            "Nyx-x86_64-windows.zip" \
            "Nyx_${VERSION}_x64-setup.exe"; do
            if [ ! -f "dist/$asset" ]; then
              echo "::error::missing release asset '$asset'"
              exit 1
            fi
          done

      - name: Build the changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog_configuration.json
          mode: COMMIT
          fromTag: ${{ needs.prepare.outputs.previous }}
          toTag: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Nyx ${{ needs.prepare.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: dist/*
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Report the release result
    if: always()
    needs: [prepare, format, lint, tag, build, cachix, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the result to the run summary
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RPM_VERSION: ${{ needs.prepare.outputs.rpm_version }}
        shell: bash
        run: |
          {
            echo "## $TAG"
            echo
            echo '| Asset | Platform |'
            echo '| --- | --- |'
            echo "| \`Nyx_${VERSION}_x64-setup.exe\` | Windows installer |"
            echo "| \`Nyx-x86_64-windows.zip\` | Windows portable |"
            echo "| \`Nyx-x86_64-linux.tar.gz\` | Linux portable |"
            echo "| \`Nyx_${VERSION}_amd64.deb\` | Debian/Ubuntu |"
            echo "| \`Nyx-${RPM_VERSION}.x86_64.rpm\` | Fedora/RHEL |"
            echo "| \`Nyx-${VERSION}-x86_64.pkg.tar.xz\` | Arch |"
          } >> "$GITHUB_STEP_SUMMARY"
          if printf '%s' "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::release $TAG did not complete"
            exit 1
          fi
