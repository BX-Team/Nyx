[package]
name = "nyx-service"
version = "0.1.0"
description = "Privileged mihomo supervisor for Nyx (Windows SCM / systemd)"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "nyx_service"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "process",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
