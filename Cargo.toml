[workspace]
members = ["crates/*"]

[workspace.package]
version = "2.2.0"

[package]
name = "nyx"
version.workspace = true
description = "Nyx — Mihomo/Clash GUI"
authors = ["BX Team"]
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/BX-Team/Nyx"
repository = "https://github.com/BX-Team/Nyx"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "nyx_lib"
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
auto-launch = "0.6"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
emojis = "0.9"
env_logger = "0.11"
futures-util = "0.3"
global-hotkey = "0.9"
gpui = { package = "gpui-kit", version = "0.8.1", default-features = false }
log = "0.4"
md-5 = "0.11"
mihomo-rs = "2.2"
moonglass = "0.1"
nyx-service = { path = "crates/nyx-service" }
nyx-sysproxy = { path = "crates/nyx-sysproxy" }
once_cell = "1"
parking_lot = "0.13"
png = "0.18"
reqwest = { version = "0.13", features = ["json", "stream"] }
rust-embed = { version = "8", features = ["include-exclude"] }
rust-i18n = "4"
self_update = { version = "1", default-features = false, features = [
    "reqwest",
    "rustls",
    "github",
    "compression-tar-gz",
    "compression-zip-deflate",
    "archive-tar",
    "archive-zip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
url = "2"

[target.'cfg(windows)'.dependencies]
image = "0.25"
raw-window-handle = "0.6"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "BX Team"
copyright = "BX Team, GPL-3.0-or-later"
license-file = ["LICENSE", "0"]
extended-description = "A modern, lightweight desktop GUI for the Mihomo proxy core."
section = "net"
priority = "optional"
depends = "$auto, libgtk-3-0, libcap2-bin"
assets = [
    ["target/release/nyx", "usr/bin/", "755"],
    ["installer/linux/nyx.desktop", "usr/share/applications/", "644"],
    ["assets/brand/logo.png", "usr/share/icons/hicolor/512x512/apps/nyx.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/nyx", dest = "/usr/bin/nyx", mode = "755" },
    { source = "installer/linux/nyx.desktop", dest = "/usr/share/applications/nyx.desktop", mode = "644" },
    { source = "assets/brand/logo.png", dest = "/usr/share/icons/hicolor/512x512/apps/nyx.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk3 = "*"
fontconfig = "*"
freetype = "*"
libcap = "*"
libxkbcommon = "*"
vulkan-loader = "*"
